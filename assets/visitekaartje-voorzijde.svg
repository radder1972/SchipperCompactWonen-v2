<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 550" width="850" height="550">
<defs>
 <style>
  @import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap');
  .f-head { font-family: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif; }
  .f-body { font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; }
  .wedge-lift { transform-origin: 120px 218px; animation: staOpWedge 5.2s cubic-bezier(.45, .05, .25, 1) infinite; }
  .frame-lift { animation: staOpFrame 5.2s cubic-bezier(.45, .05, .25, 1) infinite; }
  .seat-tilt { transform-origin: 120px 172px; animation: staOpSeat 5.2s cubic-bezier(.45, .05, .25, 1) infinite; }
  .back-tilt { transform-origin: 120px 148px; animation: staOpBack 5.2s cubic-bezier(.45, .05, .25, 1) infinite; }
  .head-tilt { transform-origin: 120px 34px; animation: staOpHead 5.2s cubic-bezier(.45, .05, .25, 1) infinite; }
  .arrow-lift { transform-origin: 120px 140px; animation: staOpArrow 5.2s cubic-bezier(.45, .05, .25, 1) infinite; }
  @keyframes staOpWedge { 0%, 16%, 90%, 100% { transform: scaleY(.38); } 48%, 68% { transform: scaleY(1.12); } }
  @keyframes staOpFrame { 0%, 16%, 90%, 100% { transform: translateY(6px); } 48%, 68% { transform: translateY(-12px); } }
  @keyframes staOpSeat { 0%, 16%, 90%, 100% { transform: translateY(6px) scaleY(.78); } 48%, 68% { transform: translateY(-14px) scaleY(1.65); } }
  @keyframes staOpBack { 0%, 16%, 90%, 100% { transform: translateY(6px) scale(1, 1); } 48%, 68% { transform: translateY(-19px) scale(1.04, .86); } }
  @keyframes staOpHead { 0%, 16%, 90%, 100% { transform: translateY(0) scale(1, 1); } 48%, 68% { transform: translateY(5px) scale(1.05, 1.08); } }
  @keyframes staOpArrow { 0%, 16%, 90%, 100% { transform: translateY(4px) scale(.97); } 48%, 68% { transform: translateY(-7px) scale(1.03); } }
 </style>
 <!-- Card backgrounds -->
 <linearGradient id="heroG" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#073d19"/>
  <stop offset="52%" stop-color="#0f6329"/>
  <stop offset="100%" stop-color="#1f9d3f"/>
 </linearGradient>
 <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#ffffff"/>
  <stop offset="100%" stop-color="#f2f9f4"/>
 </linearGradient>
 <linearGradient id="goldSw" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#f59e0b" stop-opacity=".95"/>
  <stop offset="55%" stop-color="#ffc247"/>
  <stop offset="100%" stop-color="#34c759" stop-opacity=".85"/>
 </linearGradient>
 <linearGradient id="topBar" x1="0%" y1="0%" x2="100%" y2="0%">
  <stop offset="0%" stop-color="#1f9d3f"/>
  <stop offset="60%" stop-color="#34c759"/>
  <stop offset="100%" stop-color="#f59e0b"/>
 </linearGradient>
 <linearGradient id="pillG" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#fff8e6"/>
  <stop offset="100%" stop-color="#ffe4a3"/>
 </linearGradient>
 <!-- Chair logo gradients -->
 <linearGradient id="lb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd67a"/><stop offset=".55" stop-color="#1f9d3f"/><stop offset="1" stop-color="#0d5a26"/></linearGradient>
 <linearGradient id="la" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48cc68"/><stop offset="1" stop-color="#0e6b2e"/></linearGradient>
 <linearGradient id="la2" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#0e6b2e"/><stop offset="1" stop-color="#48cc68"/></linearGradient>
 <linearGradient id="ls" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#88ec9f"/><stop offset="1" stop-color="#1f9d3f"/></linearGradient>
 <linearGradient id="lf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#157a36"/><stop offset="1" stop-color="#063b17"/></linearGradient>
 <linearGradient id="lsw" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#e58a00"/><stop offset=".55" stop-color="#f59e0b"/><stop offset="1" stop-color="#ffd25a"/></linearGradient>
 <radialGradient id="lsh"><stop offset="0" stop-color="#000" stop-opacity=".4"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <clipPath id="lc"><path d="M68 38C68 18 88 10 120 10s52 8 52 28l6 116H62z"/></clipPath>
 <clipPath id="cardClip"><rect width="850" height="550" rx="24"/></clipPath>
</defs>

<g clip-path="url(#cardClip)">
 <!-- Light right/bottom surface -->
 <rect width="850" height="550" fill="url(#cardBg)"/>

 <!-- Subtle decorative watermark swoosh in bottom right -->
 <path d="M460,560 C580,470 710,430 870,460 L870,560 Z" fill="#1f9d3f" fill-opacity=".05"/>
 <path d="M490,560 C600,490 730,455 870,480" fill="none" stroke="url(#goldSw)" stroke-width="2.5" stroke-opacity=".4"/>

 <!-- Deep green top banner with signature curved swoosh divider -->
 <path d="M0,0 L850,0 L850,178 C640,234 330,136 0,204 Z" fill="url(#heroG)"/>
 <!-- Ambient glow in green header -->
 <circle cx="740" cy="40" r="180" fill="#5fd67a" fill-opacity=".14"/>
 <path d="M-20,165 C260,105 560,205 870,145" fill="none" stroke="#ffffff" stroke-opacity=".1" stroke-width="18"/>

 <!-- Golden-green house-style swoosh ribbon along the wave edge -->
 <path d="M0,202 C330,134 640,232 850,176 L850,185 C640,241 330,143 0,211 Z" fill="url(#goldSw)"/>

 <!-- Top-left: 3D Sta-Op Fauteuil Logo in white-glow medallion -->
 <g transform="translate(44, 24) scale(0.56)">
  <ellipse cx="120" cy="239" rx="102" ry="9" fill="url(#lsh)"/>
  <rect x="44" y="218" width="152" height="12" rx="6" fill="#04260e"/>
  <rect x="58" y="226" width="22" height="9" rx="4" fill="#021708"/>
  <rect x="160" y="226" width="22" height="9" rx="4" fill="#021708"/>
  <g class="wedge-lift"><path d="M52 218L56 176L184 176L188 218Z" fill="url(#lf)"/>
  <path d="M64 206H176M64 192H176" stroke="#5fd67a" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round"/></g>
  <g class="back-tilt">
   <path d="M68 38C68 18 88 10 120 10s52 8 52 28l6 116H62z" fill="url(#lb)" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>
   <g clip-path="url(#lc)" stroke="#fff" stroke-opacity=".34" stroke-width="2.2" fill="none">
    <path d="M-50 14L50 140M50 14L-50 140"/><path d="M-30 14L70 140M70 14L-30 140"/><path d="M-10 14L90 140M90 14L-10 140"/>
    <path d="M10 14L110 140M110 14L10 140"/><path d="M30 14L130 140M130 14L30 140"/><path d="M50 14L150 140M150 14L50 140"/>
    <path d="M70 14L170 140M170 14L70 140"/><path d="M90 14L190 140M190 14L90 140"/><path d="M110 14L210 140M210 14L110 140"/>
    <path d="M130 14L230 140M230 14L130 140"/><path d="M150 14L250 140M250 14L150 140"/><path d="M170 14L270 140M270 14L170 140"/>
   </g>
   <g clip-path="url(#lc)" fill="#fff" fill-opacity=".88">
    <circle cx="100" cy="62" r="2.8"/><circle cx="140" cy="62" r="2.8"/><circle cx="120" cy="86" r="2.8"/>
    <circle cx="100" cy="110" r="2.8"/><circle cx="140" cy="110" r="2.8"/><circle cx="120" cy="132" r="2.8"/>
   </g>
   <g class="head-tilt">
    <rect x="78" y="18" width="84" height="30" rx="14" fill="url(#ls)" stroke="#0d5a26" stroke-width="2"/>
    <path d="M88 24h64" stroke="#fff" stroke-opacity=".65" stroke-width="2.5" stroke-linecap="round"/>
   </g>
  </g>
  <g class="seat-tilt">
   <path d="M60 138Q120 122 180 138L188 172H52z" fill="url(#ls)"/>
   <path d="M58 140Q120 126 182 140" fill="none" stroke="#fff" stroke-opacity=".68" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="frame-lift">
   <rect x="24" y="92" width="44" height="114" rx="18" fill="url(#la)"/>
   <rect x="172" y="92" width="44" height="114" rx="18" fill="url(#la2)"/>
   <rect x="28" y="95" width="36" height="14" rx="7" fill="#fff" fill-opacity=".35"/>
   <rect x="176" y="95" width="36" height="14" rx="7" fill="#fff" fill-opacity=".25"/>
   <rect x="52" y="164" width="136" height="42" rx="14" fill="url(#lb)"/>
   <rect x="64" y="171" width="112" height="26" rx="9" fill="url(#lf)" fill-opacity=".45"/>
   <path d="M29 148h32v38a8 8 0 0 1-8 8H37a8 8 0 0 1-8-8z" fill="#0b4f21" fill-opacity=".55" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>
   <rect x="36" y="132" width="18" height="28" rx="6" fill="#073816" stroke="#fff" stroke-width="1.8"/>
   <circle cx="45" cy="141" r="2.8" fill="#ffc247"/>
   <circle cx="45" cy="150" r="2.8" fill="#5fd67a"/>
  </g>
  <g class="arrow-lift">
   <path d="M48 184C98 198 164 168 198 86L211 92L205 54L173 75L185 80C154 146 96 172 48 184Z" fill="#000" opacity=".2" transform="translate(0 5)"/>
   <path d="M48 184C98 198 164 168 198 86L211 92L205 54L173 75L185 80C154 146 96 172 48 184Z" fill="url(#lsw)" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke"/>
  </g>
 </g>

 <!-- Brand Name & Payoff in Header -->
 <text x="196" y="78" class="f-head" font-size="36" fill="#ffffff" letter-spacing="-0.8">
  <tspan font-weight="800" fill="#7ce895">Schipper</tspan>
  <tspan font-weight="600"> Compact Wonen</tspan>
 </text>
 <text x="198" y="106" class="f-body" font-size="15.5" font-weight="500" fill="#e2f5e6" opacity=".95">
  De specialist in sta-op stoelen en zorghulpmiddelen
 </text>

 <!-- 3 Specialty Pills in Header -->
 <g transform="translate(198, 122)" class="f-body" font-size="11.5" font-weight="700" fill="#ffffff">
  <rect x="0" y="0" width="96" height="24" rx="12" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".28"/>
  <circle cx="14" cy="12" r="3.5" fill="#ffc247"/>
  <text x="24" y="16">Zitcomfort</text>

  <rect x="106" y="0" width="98" height="24" rx="12" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".28"/>
  <circle cx="120" cy="12" r="3.5" fill="#7ce895"/>
  <text x="130" y="16">Ligcomfort</text>

  <rect x="214" y="0" width="106" height="24" rx="12" fill="#ffffff" fill-opacity=".14" stroke="#ffffff" stroke-opacity=".28"/>
  <circle cx="228" cy="12" r="3.5" fill="#ffc247"/>
  <text x="238" y="16">Zorgcomfort</text>
 </g>

 <!-- Person Spotlight: Geertjan Klein Haneveld -->
 <g transform="translate(54, 248)">
  <!-- Role pill in house style -->
  <rect x="0" y="0" width="292" height="28" rx="14" fill="url(#pillG)" stroke="#f59e0b" stroke-opacity=".5"/>
  <circle cx="16" cy="14" r="4.5" fill="#1f9d3f"/>
  <text x="28" y="18.5" class="f-body" font-size="11.5" font-weight="700" fill="#4a2c00" letter-spacing="0.5">BEWEGINGSTECHNOLOOG &amp; ADVISEUR</text>

  <!-- Full Name -->
  <text x="0" y="68" class="f-head" font-size="34" font-weight="800" fill="#12261a" letter-spacing="-0.7">Geertjan Klein Haneveld</text>
  <!-- Signature swoosh under name -->
  <path d="M2,80 C55,73 115,73 168,78 C115,76 55,76 2,80 Z" fill="url(#topBar)" stroke="url(#topBar)" stroke-width="2" stroke-linecap="round"/>
 </g>

 <!-- Contact Grid (2 columns of 2nd-order custom icons) -->
 <!-- Left Column: Phone & Email -->
 <g transform="translate(54, 362)">
  <!-- Phone -->
  <g transform="translate(0, 0)">
   <rect x="0" y="0" width="42" height="42" rx="12" fill="#e9f7ed" stroke="#cde8d4"/>
   <g transform="translate(9, 9)">
    <path d="M5 3.5h3.2l1.6 4.2-2 1.4a11.5 11.5 0 0 0 6.6 6.6l1.4-2 4.2 1.6v3.2a2 2 0 0 1-2.2 2A17.5 17.5 0 0 1 3 5.7 2 2 0 0 1 5 3.5z" fill="rgba(31,157,63,.16)" stroke="#1f9d3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M14.5 4.5a5 5 0 0 1 5 5M14.5 8a1.8 1.8 0 0 1 1.8 1.8" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
   </g>
   <text x="56" y="16" class="f-body" font-size="11.5" font-weight="700" fill="#5a6e60" letter-spacing="0.4">TELEFOON DIRECT</text>
   <text x="56" y="36" class="f-head" font-size="19" font-weight="700" fill="#12261a">078 – 631 4858</text>
  </g>

  <!-- Email -->
  <g transform="translate(0, 62)">
   <rect x="0" y="0" width="42" height="42" rx="12" fill="#e9f7ed" stroke="#cde8d4"/>
   <g transform="translate(9, 9)">
    <rect x="2.5" y="5" width="19" height="14" rx="2.5" fill="rgba(31,157,63,.16)" stroke="#1f9d3f" stroke-width="2"/>
    <path d="M3.5 6.5L12 13l8.5-6.5" fill="none" stroke="#f59e0b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
   </g>
   <text x="56" y="16" class="f-body" font-size="11.5" font-weight="700" fill="#5a6e60" letter-spacing="0.4">E-MAIL</text>
   <text x="56" y="35" class="f-body" font-size="16" font-weight="700" fill="#1f9d3f">info@schippercompactwonen.nl</text>
  </g>
 </g>

 <!-- Right Column: Showroom Address & Website -->
 <g transform="translate(454, 362)">
  <!-- Showroom Address -->
  <g transform="translate(0, 0)">
   <rect x="0" y="0" width="42" height="42" rx="12" fill="#e9f7ed" stroke="#cde8d4"/>
   <g transform="translate(9, 9)">
    <path d="M12 21.5s-6.5-5.8-6.5-11a6.5 6.5 0 1 1 13 0c0 5.2-6.5 11-6.5 11z" fill="rgba(31,157,63,.16)" stroke="#1f9d3f" stroke-width="2" stroke-linejoin="round"/>
