   </g>
   <text x="56" y="16" class="f-body" font-size="11.5" font-weight="700" fill="#5a6e60" letter-spacing="0.4">SHOWROOM DORDRECHT (GRATIS PARKEREN)</text>
   <text x="56" y="35" class="f-body" font-size="16" font-weight="700" fill="#12261a">Merwedestraat 239, 3313 GT Dordrecht</text>
  </g>

  <!-- Website & Opening hours -->
  <g transform="translate(0, 62)">
   <rect x="0" y="0" width="42" height="42" rx="12" fill="#e9f7ed" stroke="#cde8d4"/>
   <g transform="translate(9, 9)">
    <circle cx="12" cy="12" r="9" fill="rgba(31,157,63,.16)" stroke="#1f9d3f" stroke-width="2"/>
    <path d="M12 7.5V12l3.2 2" fill="none" stroke="#f59e0b" stroke-width="2.3" stroke-linecap="round"/>
   </g>
   <text x="56" y="16" class="f-body" font-size="11.5" font-weight="700" fill="#5a6e60" letter-spacing="0.4">WEBSITE &amp; ADVIES AAN HUIS</text>
   <text x="56" y="35" class="f-body" font-size="16" font-weight="700" fill="#12261a">www.schippercompactwonen.nl</text>
  </g>
 </g>

 <!-- Bottom accent bar -->
 <rect x="0" y="542" width="850" height="8" fill="url(#topBar)"/>
</g>
</svg>