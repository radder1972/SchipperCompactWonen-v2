   <rect x="0" y="0" width="22" height="22" rx="6" fill="#ffffff" stroke="#1f9d3f" stroke-width="2"/>
   <text x="30" y="16">Showroom Dordrecht</text>

   <rect x="204" y="0" width="22" height="22" rx="6" fill="#ffffff" stroke="#1f9d3f" stroke-width="2"/>
   <text x="234" y="16">Bezoek bij u thuis</text>
  </g>

  <!-- Write-in fields for Geertjan -->
  <g transform="translate(0, 146)" class="f-body">
   <text x="0" y="14" font-size="11.5" font-weight="700" fill="#5a6e60" letter-spacing="0.4">DATUM &amp; TIJDSTIP</text>
   <rect x="0" y="24" width="398" height="44" rx="10" fill="#ffffff" stroke="#cde8d4" stroke-width="1.5"/>
   <text x="16" y="51" font-size="14" fill="#9fb8a6">Datum: ____ / ____ / 202__     om: ____ : ____ uur</text>

   <text x="0" y="96" font-size="11.5" font-weight="700" fill="#5a6e60" letter-spacing="0.4">BESPROKEN MODEL / MAATVOERING / NOTITIE</text>
   <rect x="0" y="106" width="398" height="118" rx="10" fill="#ffffff" stroke="#cde8d4" stroke-width="1.5"/>
   <line x1="16" y1="144" x2="382" y2="144" stroke="#dfeae1" stroke-dasharray="4 4"/>
   <line x1="16" y1="182" x2="382" y2="182" stroke="#dfeae1" stroke-dasharray="4 4"/>
  </g>

  <!-- Footer note on back -->
  <g transform="translate(0, 404)" class="f-body" font-size="13" fill="#5a6e60">
   <text x="0" y="16"><tspan font-weight="700" fill="#1f9d3f">Vragen of verzetten?</tspan> Bel gerust: <tspan font-weight="700" fill="#12261a">078 – 631 4858</tspan></text>
   <text x="0" y="36" font-size="12">Merwedestraat 239 · 3313 GT Dordrecht · Gratis parkeren voor de deur</text>
  </g>
 </g>

 <rect x="0" y="542" width="850" height="8" fill="url(#topBar)"/>
</g>
</svg>