  <path d="M48 184C98 198 164 168 198 86L211 92L205 54L173 75L185 80C154 146 96 172 48 184Z" fill="#000" opacity=".2" transform="translate(0 5)"/>
  <path d="M48 184C98 198 164 168 198 86L211 92L205 54L173 75L185 80C154 146 96 172 48 184Z" fill="url(#lsw)" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke"/>
 </g>

 <!-- Left panel text & opening hours -->
 <g transform="translate(172, 265)" text-anchor="middle" fill="#ffffff">
  <text y="0" class="f-head" font-size="22" font-weight="800" fill="#7ce895">Al 35+ jaar</text>
  <text y="25" class="f-head" font-size="18" font-weight="700">dé zit- en zorgspecialist</text>
  <line x1="-70" y1="44" x2="70" y2="44" stroke="#ffffff" stroke-opacity=".22" stroke-width="1.5"/>
  <text y="68" class="f-body" font-size="12.5" font-weight="700" fill="#ffc247" letter-spacing="0.5">OPENINGSTIJDEN SHOWROOM</text>
  <text y="90" class="f-body" font-size="14" font-weight="600" fill="#e8f5eb">Di t/m Vr: 10:00 – 16:00 uur</text>
  <text y="112" class="f-body" font-size="13.5" font-weight="500" fill="#c7e6ce">Ma &amp; Za: Op afspraak</text>
  <rect x="-102" y="132" width="204" height="30" rx="15" fill="#ffffff" fill-opacity=".13" stroke="#ffffff" stroke-opacity=".25"/>
  <text y="151" class="f-body" font-size="12.5" font-weight="700" fill="#ffffff">Gratis advies aan huis</text>
  <text y="194" class="f-body" font-size="11.5" fill="#a8d5b3">KvK 24391284 · Dordrecht</text>
 </g>

 <!-- Right side: Practical Appointment & Model Note Card -->
 <g transform="translate(396, 52)">
  <rect x="0" y="0" width="204" height="26" rx="13" fill="#fff8e6" stroke="#f59e0b" stroke-opacity=".5"/>
  <circle cx="14" cy="13" r="4" fill="#1f9d3f"/>
  <text x="24" y="17" class="f-body" font-size="11" font-weight="700" fill="#4a2c00" letter-spacing="0.5">AFSPRAAK &amp; ADVIESNOTITIE</text>

  <text x="0" y="60" class="f-head" font-size="26" font-weight="800" fill="#12261a" letter-spacing="-0.4">Uw persoonlijke afspraak</text>
  <path d="M2,70 C45,64 95,64 140,68 C95,66 45,66 2,70 Z" fill="url(#topBar)" stroke="url(#topBar)" stroke-width="2"/>

  <!-- Checkboxes: Showroom vs Thuisbezoek -->
