<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250">
<defs>
 <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fd67a"/><stop offset=".55" stop-color="#1f9d3f"/><stop offset="1" stop-color="#0d5a26"/></linearGradient>
 <linearGradient id="a" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#48cc68"/><stop offset="1" stop-color="#0e6b2e"/></linearGradient>
 <linearGradient id="a2" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#0e6b2e"/><stop offset="1" stop-color="#48cc68"/></linearGradient>
 <linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#96f2ab"/><stop offset=".45" stop-color="#48cc68"/><stop offset="1" stop-color="#147a32"/></linearGradient>
 <linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#157a36"/><stop offset="1" stop-color="#063b17"/></linearGradient>
 <linearGradient id="sw" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#e58a00"/><stop offset=".55" stop-color="#f59e0b"/><stop offset="1" stop-color="#ffd25a"/></linearGradient>
 <radialGradient id="sh"><stop offset="0" stop-color="#000" stop-opacity=".35"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
 <clipPath id="c"><path d="M68 38C68 18 88 10 120 10s52 8 52 28l6 116H62z"/></clipPath>
</defs>

<!-- Vloerschaduw -->
<ellipse cx="120" cy="239" rx="102" ry="9" fill="url(#sh)"/>

<!-- Vaste horizontale vloerplaat op de grond -->
<rect x="44" y="218" width="152" height="12" rx="6" fill="#063b17"/>
<rect x="58" y="226" width="22" height="9" rx="4" fill="#04260e"/>
<rect x="160" y="226" width="22" height="9" rx="4" fill="#04260e"/>

<!-- Recht omhoog komend hef-onderstel (symmetrisch, geen zijwaartse scheefstand) -->
<g class="wedge-lift">
 <path d="M52 218L58 176L182 176L188 218Z" fill="url(#f)"/>
 <path d="M66 208L174 208M68 194L172 194" stroke="#5fd67a" stroke-opacity=".34" stroke-width="2.5" stroke-linecap="round"/>
</g>

<!-- Rugleuning die recht omhoog komt én voorover naar de kijker buigt -->
<g class="back-tilt">
 <path d="M68 38C68 18 88 10 120 10s52 8 52 28l6 116H62z" fill="url(#b)"/>
 <g clip-path="url(#c)" stroke="#fff" stroke-opacity=".32" stroke-width="2.2" fill="none">
  <path d="M-50 14L50 140M50 14L-50 140"/><path d="M-30 14L70 140M70 14L-30 140"/><path d="M-10 14L90 140M90 14L-10 140"/>
  <path d="M10 14L110 140M110 14L10 140"/><path d="M30 14L130 140M130 14L30 140"/><path d="M50 14L150 140M150 14L50 140"/>
  <path d="M70 14L170 140M170 14L70 140"/><path d="M90 14L190 140M190 14L90 140"/><path d="M110 14L210 140M210 14L110 140"/>
  <path d="M130 14L230 140M230 14L130 140"/><path d="M150 14L250 140M250 14L150 140"/><path d="M170 14L270 140M270 14L170 140"/>
 </g>
 <g clip-path="url(#c)" fill="#fff" fill-opacity=".85">
  <circle cx="100" cy="62" r="2.8"/><circle cx="140" cy="62" r="2.8"/>
  <circle cx="120" cy="86" r="2.8"/>
  <circle cx="100" cy="110" r="2.8"/><circle cx="140" cy="110" r="2.8"/>
  <circle cx="120" cy="132" r="2.8"/>
 </g>
 <!-- Zacht ergonomisch nekkussen dat naar de kijker toe kantelt -->
 <g class="head-tilt">
  <rect x="78" y="18" width="84" height="30" rx="14" fill="url(#s)" stroke="#0d5a26" stroke-width="2"/>
  <path d="M88 24h64" stroke="#fff" stroke-opacity=".68" stroke-width="2.5" stroke-linecap="round"/>
 </g>
</g>

<!-- Voorover kantelend zitvlak (achterkant komt hoger omhoog dan voorkant -> echt voorwaarts kantelperspectief) -->
<g class="seat-tilt">
 <path d="M60 138Q120 120 180 138L188 172H52z" fill="url(#s)"/>
 <path d="M60 140Q120 124 180 140" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- Armwangen, voorfront & zijvak met afstandsbediening (komen recht omhoog zonder zijwaartse scheefstand) -->
<g class="frame-lift">
 <rect x="24" y="92" width="44" height="114" rx="18" fill="url(#a)"/>
 <rect x="172" y="92" width="44" height="114" rx="18" fill="url(#a2)"/>
 <rect x="28" y="95" width="36" height="14" rx="7" fill="#fff" fill-opacity=".35"/>
 <rect x="176" y="95" width="36" height="14" rx="7" fill="#fff" fill-opacity=".28"/>

 <!-- Beensteun / voetenklep voorzijde -->
 <rect x="52" y="164" width="136" height="42" rx="14" fill="url(#b)"/>
 <rect x="64" y="171" width="112" height="26" rx="9" fill="url(#f)" fill-opacity=".45"/>

 <!-- Zijvak met handbediening -->
 <path d="M29 148h32v38a8 8 0 0 1-8 8H37a8 8 0 0 1-8-8z" fill="#0b4f21" fill-opacity=".55" stroke="#fff" stroke-opacity=".3" stroke-width="1.5"/>
 <rect x="36" y="132" width="18" height="28" rx="6" fill="#073816" stroke="#fff" stroke-width="1.8"/>
 <circle class="btn-glow" cx="45" cy="141" r="2.8" fill="#ffc247"/>
 <circle cx="45" cy="150" r="2.8" fill="#5fd67a"/>
</g>

<!-- Gouden "Sta-Op" pijl-swoosh -->
<g class="arrow-lift">
 <path d="M48 184C98 198 164 168 198 86L211 92L205 54L173 75L185 80C154 146 96 172 48 184Z" fill="#000" opacity=".18" transform="translate(0 5)"/>
 <path d="M48 184C98 198 164 168 198 86L211 92L205 54L173 75L185 80C154 146 96 172 48 184Z" fill="url(#sw)" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke"/>
</g>
<script><![CDATA[
 (function(){
  var s = document.documentElement, t;
  s.addEventListener('dblclick', function(){
   s.classList.remove('dancing');
   void s.offsetWidth;
   s.classList.add('dancing');
   clearTimeout(t);
   t = setTimeout(function(){ s.classList.remove('dancing'); }, 3200);
  });
 })();
]]></script>
</svg>